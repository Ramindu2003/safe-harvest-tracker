<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Dashboard - Safe Harvest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h2 class="text-2xl font-bold text-green-700 mb-4">Farmer Dashboard 👨🏽‍🌾</h2>
        <p class="text-gray-600 mb-6">Enter spray details to generate harvest QR code.</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Crop Name (එළවළුව)</label>
                <input type="text" id="crop" placeholder="e.g. Cabbage" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Chemical Used (බෙහෙත)</label>
                <input type="text" id="chem" placeholder="e.g. Abamectin" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Date Applied (ගැහුව දවස)</label>
                <input type="date" id="date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Safe Interval in Days (PHI දවස් ගාණ)</label>
                <input type="number" id="phi" placeholder="e.g. 14" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>

            <button onclick="generateQR()" class="w-full bg-green-600 text-white p-2 rounded-md hover:bg-green-700 font-bold">Generate QR Code</button>
        </div>

        <div id="qr-section" class="mt-8 hidden flex flex-col items-center">
            <h3 class="text-lg font-bold text-gray-800 mb-2">Stick this on your harvest:</h3>
            <canvas id="qrcode"></canvas>
            <p class="text-xs text-gray-500 mt-2 text-center">Scan to verify safety.</p>
            <a id="demo-link" href="#" target="_blank" class="mt-4 text-blue-500 underline text-sm">Click here to simulate QR scan</a>
        </div>
    </div>

    <script>
        function generateQR() {
            const crop = document.getElementById('crop').value;
            const chem = document.getElementById('chem').value;
            const date = document.getElementById('date').value;
            const phi = document.getElementById('phi').value;

            if(!crop || !chem || !date || !phi) {
                alert("Please fill all fields!");
                return;
            }

            // Create the link for the customer page
            const baseUrl = window.location.href.replace('generator.html', '');
            const scanUrl = `${baseUrl}scan.html?crop=${crop}&chem=${chem}&date=${date}&phi=${phi}`;

            // Show QR section
            document.getElementById('qr-section').classList.remove('hidden');

            // Generate QR Code
            var qr = new QRious({
                element: document.getElementById('qrcode'),
                value: scanUrl,
                size: 200,
                foreground: 'black',
                background: 'white'
            });

            // Set demo link for easy clicking
            document.getElementById('demo-link').href = scanUrl;
        }
    </script>
</body>
</html>
